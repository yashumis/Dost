name: Build Dost app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: Dost

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build the app
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename app file
        run: cp app/build/outputs/apk/debug/app-debug.apk Dost.apk

      - name: Keep app file
        uses: actions/upload-artifact@v4
        with:
          name: Dost-app
          path: Dost/Dost.apk

      - name: Publish for phone download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Dost build ${{ github.run_number }}
          body: Download Dost.apk below on your phone and install it.
          files: Dost/Dost.apk
